<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<!-- A solid status bar: iOS mis-sizes home-screen apps under a translucent one
	     (blank strip at the bottom, taps landing off target). -->
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<meta name="apple-mobile-web-app-title" content="Sea Waves">
	<meta name="theme-color" content="#0b1422">
	<meta name="description" content="Drift on a calm, realistic sea. Pick the time of day and the weather, and relax to gentle music.">
	<title>Sea Waves</title>
	<link rel="manifest" href="manifest.webmanifest">
	<link rel="apple-touch-icon" href="icon-180.png">
	<link rel="icon" type="image/png" href="icon-512.png">
	<link rel="stylesheet" href="style.css?v=18">
	<script type="importmap">
		{
			"imports": {
				"three": "./lib/three.module.min.js?v=18",
				"./lib/Water.js": "./lib/Water.js?v=18",
				"./js/ocean.js": "./js/ocean.js?v=18",
				"./js/audio.js": "./js/audio.js?v=18",
				"./js/wildlife.js": "./js/wildlife.js?v=18",
				"./js/astro.js": "./js/astro.js?v=18",
				"./js/starfield.js": "./js/starfield.js?v=18",
				"./js/starcatalog.js": "./js/starcatalog.js?v=18",
				"./js/skytraffic.js": "./js/skytraffic.js?v=18",
				"./js/clock.js": "./js/clock.js?v=18"
			}
		}
	</script>
</head>
<body>
	<canvas id="scene" aria-label="Animated ocean scene"></canvas>

	<section id="menu" class="panel-wrap">
		<div class="panel">
			<div class="col">
			<h1>Sea Waves</h1>
			<p class="sub">Choose your moment on the water</p>

			<h2>Time</h2>
			<div class="chips times" role="group" aria-label="Time of day">
				<button data-time="sunrise"><span>🌅</span>Sunrise</button>
				<button data-time="morning"><span>🌤️</span>Morning</button>
				<button data-time="noon"><span>☀️</span>Noon</button>
				<button data-time="sunset"><span>🌇</span>Sunset</button>
				<button data-time="twilight"><span>🌌</span>Twilight</button>
				<button data-time="night"><span>🌙</span>Night</button>
			</div>
			<p id="skyinfo" class="skyinfo"></p>

			<h2>Weather</h2>
			<div class="chips" role="group" aria-label="Weather">
				<button data-weather="clear"><span>✨</span>Clear</button>
				<button data-weather="cloudy"><span>☁️</span>Cloudy</button>
				<button data-weather="rain"><span>🌧️</span>Rain</button>
				<button data-weather="storm"><span>⛈️</span>Storm</button>
				<button data-weather="fog"><span>🌫️</span>Fog</button>
			</div>
			</div>

			<div class="col">
			<h2>Sea life</h2>
			<div class="chips extras" role="group" aria-label="Sea life and scenery">
				<button data-extra="whales"><span>🐋</span>Whales</button>
				<button data-extra="gulls"><span>🕊️</span>Seagulls</button>
				<button data-extra="islands"><span>⛰️</span>Islands</button>
				<button data-extra="planes"><span>✈️</span>Planes</button>
				<button data-extra="clock"><span>🕰️</span>Clock</button>
			</div>

			<h2>Sound &amp; view</h2>
			<label class="toggle">
				<input type="checkbox" id="music" checked>
				<span class="track"><span class="knob"></span></span>
				Peaceful music
			</label>
			<label class="toggle">
				<input type="checkbox" id="ambient" checked>
				<span class="track"><span class="knob"></span></span>
				Ocean &amp; nature sounds
			</label>

			<label class="toggle">
				<input type="checkbox" id="float" checked>
				<span class="track"><span class="knob"></span></span>
				Float with the waves
			</label>

			<button id="begin" class="begin">Set sail</button>
			</div>
		</div>
	</section>

	<div id="hud" class="hidden">
		<button id="musicBtn" class="round" aria-pressed="true" aria-label="Music volume" aria-expanded="false" aria-controls="mixer">
			<svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12" fill="none"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/><path class="slash" d="M4 4l16 16" fill="none"/></svg>
		</button>
		<button id="ambientBtn" class="round" aria-pressed="true" aria-label="Ocean and nature sounds volume" aria-expanded="false" aria-controls="mixer">
			<svg viewBox="0 0 24 24"><path d="M3 9c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 14c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 19c2-2 4-2 6 0s4 2 6 0 4-2 6 0" fill="none"/><path class="slash" d="M4 4l16 16" fill="none"/></svg>
		</button>
		<div id="mixer" class="mixer" hidden>
			<div class="mix-row" data-mix="music">
				<label class="toggle small"><input type="checkbox"><span class="track"><span class="knob"></span></span>Peaceful music</label>
				<div class="mix-slide"><input type="range" min="0" max="100" step="1" aria-label="Music volume"><output></output></div>
			</div>
			<div class="mix-row" data-mix="ambient">
				<label class="toggle small"><input type="checkbox"><span class="track"><span class="knob"></span></span>Ocean &amp; nature</label>
				<div class="mix-slide"><input type="range" min="0" max="100" step="1" aria-label="Ocean and nature sounds volume"><output></output></div>
			</div>
		</div>
		<button id="settings" class="round" aria-label="Change time and weather">
			<svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" fill="none"/><circle cx="16" cy="7" r="2" fill="none"/><circle cx="10" cy="17" r="2" fill="none"/></svg>
		</button>
	</div>

	<p id="hint">Drag to look around · pinch to zoom</p>
	<p id="zoomlevel" aria-live="polite"></p>

	<p id="nogl" hidden>Sorry, this device can't show the 3D sea (WebGL is unavailable).</p>

	<!-- Bump v= on every release so phones never mix cached old scripts with a new page. -->
	<script type="module" src="js/main.js?v=18"></script>
</body>
</html>
