<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Sea Waves">
	<meta name="theme-color" content="#0b1422">
	<meta name="description" content="Drift on a calm, realistic sea. Pick the time of day and the weather, and relax to gentle music.">
	<title>Sea Waves</title>
	<link rel="stylesheet" href="style.css">
	<script type="importmap">
		{ "imports": { "three": "./lib/three.module.min.js" } }
	</script>
</head>
<body>
	<canvas id="scene" aria-label="Animated ocean scene"></canvas>

	<div id="starlabels" aria-hidden="true"></div>

	<section id="menu" class="panel-wrap">
		<div class="panel">
			<div class="col">
			<h1>Sea Waves</h1>
			<p class="sub">Choose your moment on the water</p>

			<h2>Time</h2>
			<div class="chips" role="group" aria-label="Time of day">
				<button data-time="sunrise"><span>🌅</span>Sunrise</button>
				<button data-time="morning"><span>🌤️</span>Morning</button>
				<button data-time="noon"><span>☀️</span>Noon</button>
				<button data-time="sunset"><span>🌇</span>Sunset</button>
				<button data-time="night"><span>🌙</span>Night</button>
			</div>
			<p id="skyinfo" class="skyinfo"></p>

			<h2>Weather</h2>
			<div class="chips" role="group" aria-label="Weather">
				<button data-weather="clear"><span>✨</span>Clear</button>
				<button data-weather="cloudy"><span>☁️</span>Cloudy</button>
				<button data-weather="rain"><span>🌧️</span>Rain</button>
				<button data-weather="storm"><span>⛈️</span>Storm</button>
				<button data-weather="fog"><span>🌫️</span>Fog</button>
			</div>
			</div>

			<div class="col">
			<h2>Sea life</h2>
			<div class="chips extras" role="group" aria-label="Sea life and scenery">
				<button data-extra="whales"><span>🐋</span>Whales</button>
				<button data-extra="gulls"><span>🕊️</span>Seagulls</button>
				<button data-extra="islands"><span>⛰️</span>Islands</button>
				<button data-extra="stars"><span>✨</span>Star signs</button>
			</div>

			<label class="toggle">
				<input type="checkbox" id="music" checked>
				<span class="track"><span class="knob"></span></span>
				Peaceful music &amp; ocean sounds
			</label>

			<button id="begin" class="begin">Set sail</button>
			</div>
		</div>
	</section>

	<div id="hud" class="hidden">
		<button id="sound" class="round" aria-pressed="true" aria-label="Sound on/off">
			<svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none"/></svg>
			<svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5m0-5l-5 5" fill="none"/></svg>
		</button>
		<button id="settings" class="round" aria-label="Change time and weather">
			<svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" fill="none"/><circle cx="16" cy="7" r="2" fill="none"/><circle cx="10" cy="17" r="2" fill="none"/></svg>
		</button>
	</div>

	<p id="hint">Drag to look around · pinch to zoom</p>
	<p id="zoomlevel" aria-live="polite"></p>

	<p id="nogl" hidden>Sorry, this device can't show the 3D sea (WebGL is unavailable).</p>

	<script type="module" src="js/main.js"></script>
</body>
</html>
